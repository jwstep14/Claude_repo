<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: monospace;
      color: #eee;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      color: #4ecca3;
      letter-spacing: 4px;
    }

    #score-board {
      display: flex;
      gap: 40px;
      margin-bottom: 12px;
      font-size: 1rem;
    }

    #score-board span {
      color: #aaa;
    }

    #score-board strong {
      color: #4ecca3;
    }

    canvas {
      border: 2px solid #4ecca3;
      background: #16213e;
      display: block;
    }

    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    #overlay h2 {
      font-size: 1.8rem;
      color: #e94560;
    }

    #overlay p {
      color: #aaa;
      font-size: 0.95rem;
    }

    button {
      margin-top: 8px;
      padding: 10px 28px;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      font-family: monospace;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
    }

    button:hover {
      background: #38b48e;
    }

    #controls {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>SNAKE</h1>

  <div id="score-board">
    <span>SCORE: <strong id="score">0</strong></span>
    <span>BEST: <strong id="best">0</strong></span>
  </div>

  <div style="position: relative;">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">SNAKE</h2>
      <p id="overlay-msg">Use arrow keys or WASD to move</p>
      <button id="start-btn">START</button>
    </div>
  </div>

  <div id="controls">Arrow Keys / WASD to move &nbsp;|&nbsp; P to pause</div>

  <script src="game.js"></script>
</body>
</html>
